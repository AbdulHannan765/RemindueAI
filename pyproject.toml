[project]
name = "remindueai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdul Hannan", email = "abdulhannanifteqar765@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg==0.31.0",
    "cryptography==50.0.2",
    "en-core-web-lg",
    "fastapi==0.136.1",
    "google-api-python-client==2.190.0",
    "google-auth==2.48.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.4",
    "groq>=0.37.1",
    "langchain==1.2.0",
    "langchain-core==1.4.7",
    "langchain-groq==1.1.3",
    "numpy==2.3.3",
    "presidio-analyzer>=2.2.365",
    "presidio-anonymizer>=2.2.365",
    "pwdlib[argon2]==0.3.0",
    "pyaileys[qrcode]>=0.1.5",
    "pyjwt==2.12.1",
    "python-dotenv==1.2.2",
    "qdrant-client[fastembed]==1.19.1",
    "qrcode[pil]>=8.2",
    "segno>=1.6.6",
    "spacy==3.8.18",
    "sqlalchemy[asyncio]==2.0.46",
    "telethon==1.45.0",
    "typesafe-sdk==0.7.2",
    "uvicorn[standard]==0.41.0",
    "waeys>=0.1.3",
]

[project.scripts]
remindueai = "remindueai:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
